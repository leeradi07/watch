<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배동윤 4대 약속</title>
<link rel="stylesheet" href="shared/flyer.css">
</head>
<body>
<div class="fit-wrap" id="fitWrap">
<div class="fit" id="fit">
<!-- 시안 A: 회장 후보 단독 -->
<article class="sheet anim" id="sheet" style="--burst: 562px 250px">

  <svg class="art" viewBox="0 0 794 1123" aria-hidden="true">
    <defs>
      <clipPath id="hero"><polygon points="0,0 794,0 794,584 0,696"/></clipPath>
    </defs>

    <g clip-path="url(#hero)">
      <rect width="794" height="700" fill="#3182f6"/>
      <g class="rays" data-burst="562,250"></g>

      <g fill="none" stroke="#fff">
        <circle class="ring r1" cx="562" cy="250" r="190" stroke-width="3" stroke-opacity=".3"/>
        <circle class="ring r2" cx="562" cy="250" r="262" stroke-width="2" stroke-opacity=".18"/>
        <circle class="ring r3" cx="562" cy="250" r="350" stroke-width="1.5" stroke-opacity=".1"/>
      </g>

      <g class="cloud"><use href="#cloud" transform="translate(22 416) scale(.8)" opacity=".95"/></g>
      <g class="cloud"><use href="#cloud" transform="translate(704 236) scale(.7)" opacity=".9"/></g>

      <!-- elementary school, tilted to follow the hero edge -->
      <g class="scene"><use href="#school" transform="translate(-260 384) skewY(-8)"/></g>

      <g class="person">
        <image href="assets/candidate.webp" x="284" y="72" width="520" height="592" filter="url(#echo)"/>
      </g>

      <!-- pledge icons flung out by the impact -->
      <g class="fly f1" style="--fx:-160px; --fy:140px; --fr:-30deg">
        <g stroke="#fff" stroke-linecap="round">
          <line x1="672" y1="150" x2="636" y2="178" stroke-width="5" stroke-opacity=".4"/>
          <line x1="690" y1="174" x2="664" y2="194" stroke-width="2.5" stroke-opacity=".3"/>
        </g>
        <g transform="translate(722 116) rotate(14)">
          <use href="#tile" x="-40" y="-40" width="80" height="80"/>
          <use href="#i-key" transform="translate(-24 -24) scale(2)"/>
        </g>
      </g>
      <g class="fly f2" style="--fx:300px; --fy:-200px; --fr:30deg">
        <g stroke="#fff" stroke-linecap="round">
          <line x1="322" y1="452" x2="358" y2="426" stroke-width="5" stroke-opacity=".4"/>
          <line x1="334" y1="476" x2="358" y2="458" stroke-width="2.5" stroke-opacity=".3"/>
        </g>
        <g transform="translate(286 484) rotate(-16)">
          <use href="#tile" x="-40" y="-40" width="80" height="80"/>
          <use href="#i-siren" transform="translate(-24 -24) scale(2)"/>
        </g>
      </g>
      <g class="fly f3" style="--fx:-180px; --fy:-150px; --fr:-24deg">
        <g stroke="#fff" stroke-linecap="round">
          <line x1="718" y1="372" x2="682" y2="344" stroke-width="4" stroke-opacity=".36"/>
        </g>
        <g transform="translate(746 404) rotate(-11) scale(.8)">
          <use href="#tile" x="-40" y="-40" width="80" height="80"/>
          <use href="#i-mail" transform="translate(-24 -24) scale(2)"/>
        </g>
      </g>
      <g class="fly f4" style="--fx:140px; --fy:160px; --fr:24deg">
        <g transform="translate(410 96) rotate(-9) scale(.6)">
          <use href="#tile" x="-40" y="-40" width="80" height="80"/>
          <use href="#i-steth" transform="translate(-24 -24) scale(2)"/>
        </g>
      </g>
    </g>

    <!-- crisp cut line where the white shirt meets the white page -->
    <line x1="-10" y1="697.4" x2="804" y2="582.6" stroke="#3182f6" stroke-width="6"/>
  </svg>

  <header class="hero-copy">
    <span class="chip"><i></i>부산교총 회장선거</span>
    <p class="role">회장 후보</p>
    <h1>배동윤</h1>
    <p class="lede">막힌 교섭은 <b>풀고</b>,<br>현안엔 <b>즉시 출동</b>합니다.</p>
  </header>

  <section class="info">
    <h2>배동윤의 <em>4대 약속</em></h2>

    <div class="grid">
      <article class="pledge">
        <div class="top">
          <span class="ico"><svg viewBox="0 0 24 24"><use href="#i-key"/></svg></span>
          <div><span class="tag"><span class="no">01</span><span class="kw">전문성</span></span>
          <h3>교섭의 마스터키</h3></div>
        </div>
        <p>교사·연구사·관리자·정책가의 경험으로<br><b>막힌 교섭 해결!</b></p>
      </article>
      <article class="pledge">
        <div class="top">
          <span class="ico"><svg viewBox="0 0 24 24"><use href="#i-siren"/></svg></span>
          <div><span class="tag"><span class="no">02</span><span class="kw">신속성</span></span>
          <h3>교권·현안 119</h3></div>
        </div>
        <p>교권 침해·3시 하교제·보결 문제,<br><b>골든타임 내 즉각 출동!</b></p>
      </article>
      <article class="pledge">
        <div class="top">
          <span class="ico"><svg viewBox="0 0 24 24"><use href="#i-mail"/></svg></span>
          <div><span class="tag"><span class="no">03</span><span class="kw">투명성</span></span>
          <h3>클린 메신저</h3></div>
        </div>
        <p>회비 내역부터 공론화 안건까지 회원에게<br><b>투명하게 다이렉트 전달!</b></p>
      </article>
      <article class="pledge">
        <div class="top">
          <span class="ico"><svg viewBox="0 0 24 24"><use href="#i-steth"/></svg></span>
          <div><span class="tag"><span class="no">04</span><span class="kw">맞춤형</span></span>
          <h3>교육가족 주치의</h3></div>
        </div>
        <p>단체보험 확대부터 저경력 유입·고경력 우대까지<br><b>1:1 맞춤 케어!</b></p>
      </article>
    </div>

    <div class="foot">
      <span>부산교총 회장선거</span>
      <span>회장 후보 <b>배동윤</b></span>
    </div>
  </section>
</article>
</div>
</div>
<script src="shared/flyer.js"></script>
</body>
</html>
